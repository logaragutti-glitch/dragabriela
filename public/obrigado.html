<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Você faz parte da rede — Dra. Gabriela & Dani Cunha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo: #F3F1EA; --fundo-escuro: #E7E2D3; --tinta: #16233A; --tinta-suave: #2B3F5C;
    --acento: #B98A2E; --acento-clara: #D9AE5C; --verde: #2E6E52; --verde-clara: #4C9376;
    --branco: #FFFFFF; --linha: rgba(22,35,58,0.14); --sombra: 0 20px 60px rgba(22,35,58,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--fundo);color:var(--tinta);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  h1,h2{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-0.01em;}
  .container{max-width:640px;margin:0 auto;padding:0 24px;}

  .nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(243,241,234,0.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha);}
  .nav-inner{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-family:'Fraunces',serif;font-style:italic;font-size:1.25rem;font-weight:500;color:var(--tinta);}

  .hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:140px 0 80px;text-align:center;}
  .selo{
    width:64px;height:64px;border-radius:50%;
    background:var(--verde);color:var(--branco);
    display:flex;align-items:center;justify-content:center;
    font-size:1.8rem;margin:0 auto 28px;
  }
  .hero h1{font-size:clamp(2rem,5vw,2.8rem);}
  .hero h1 em{font-style:italic;color:var(--acento);}
  .hero p{margin-top:16px;color:var(--tinta-suave);font-size:1rem;max-width:460px;margin-left:auto;margin-right:auto;}

  .link-box{
    margin-top:44px;
    background:var(--branco);
    border-radius:14px;
    padding:28px;
    box-shadow:var(--sombra);
    border-top:4px solid var(--verde);
    text-align:left;
  }
  .link-box label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--tinta-suave);display:block;margin-bottom:10px;
  }
  .link-row{display:flex;gap:10px;}
  .link-row input{
    flex:1;border:1px solid var(--linha);background:var(--fundo);
    border-radius:8px;padding:12px 14px;font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;color:var(--tinta);
  }
  .btn-copy{
    background:var(--tinta);color:var(--fundo);border:none;
    border-radius:8px;padding:0 20px;font-weight:600;font-size:0.85rem;cursor:pointer;
    white-space:nowrap;
  }
  .btn-copy.copiado{background:var(--verde);}

  .share-row{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;}
  .btn-share{
    flex:1;padding:14px 20px;border-radius:100px;font-weight:600;font-size:0.9rem;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--verde);color:var(--branco);border:none;cursor:pointer;
    min-width:200px;
  }

  .sim-note{
    margin-top:24px;font-size:0.8rem;color:var(--acento);
    background:rgba(185,138,46,0.1);border:1px solid rgba(185,138,46,0.3);
    border-radius:8px;padding:12px 16px;text-align:left;
  }

  .voltar{display:inline-block;margin-top:36px;font-size:0.9rem;font-weight:500;color:var(--tinta-suave);}
  .voltar:hover{color:var(--tinta);}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">Gabriela &amp; Dani</a>
  </div>
</nav>

<section class="hero">
  <div class="container">
    <div class="selo">✓</div>
    <h1>Você agora faz parte <em>da rede</em>.</h1>
    <p>Compartilhe seu link exclusivo com amigos e família — cada cadastro feito por ele conta pra você no ranking de apoiadores.</p>

    <div class="link-box">
      <label>Seu link de indicação</label>
      <div class="link-row">
        <input type="text" id="linkIndicacao" readonly value="">
        <button class="btn-copy" id="btnCopiar">Copiar</button>
      </div>
      <div class="share-row">
        <button class="btn-share" id="btnWhatsapp">💬 Compartilhar no WhatsApp</button>
      </div>
    </div>

    <p class="sim-note" id="simNote" style="display:none;"></p>

    <a href="index.html" class="voltar">← Voltar para o site</a>
  </div>
</section>

<script>
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get('codigo') || '';
  const link = params.get('link') || (window.location.origin + window.location.pathname.replace('obrigado.html','index.html') + '?ref=' + codigo);

  document.getElementById('linkIndicacao').value = link;
  if(!codigo){
    // Chegou aqui sem passar pelo cadastro (ex: acesso direto à URL) — avisa em vez de mostrar um link vazio.
    document.getElementById('simNote').textContent = 'Não encontramos seu código de indicação. Volte e refaça o cadastro pelo site.';
    document.getElementById('simNote').style.display = 'block';
  }

  document.getElementById('btnCopiar').addEventListener('click', () => {
    const input = document.getElementById('linkIndicacao');
    input.select();
    navigator.clipboard.writeText(input.value).then(() => {
      const btn = document.getElementById('btnCopiar');
      const original = btn.textContent;
      btn.textContent = 'Copiado ✓';
      btn.classList.add('copiado');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copiado'); }, 2000);
    });
  });

  document.getElementById('btnWhatsapp').addEventListener('click', () => {
    const texto = encodeURIComponent(`Entra na rede de apoio comigo! ${link}`);
    window.open(`https://wa.me/?text=${texto}`, '_blank');
  });
</script>

</body>
</html>
