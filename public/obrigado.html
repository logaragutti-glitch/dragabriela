<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Cadastro concluído — Dra. Gabriela & Dani Cunha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--fundo:#F3F1EA;--tinta:#16233A;--tinta-suave:#2B3F5C;--acento:#B98A2E;--verde:#2E6E52;--branco:#FFF;--linha:rgba(22,35,58,.14);--sombra:0 20px 60px rgba(22,35,58,.12)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--fundo);color:var(--tinta);font-family:Inter,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid var(--acento);outline-offset:3px}.container{max-width:640px;margin:0 auto;padding:0 24px}.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(243,241,234,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}.nav-inner{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center}.logo{font-family:Fraunces,serif;font-style:italic;font-size:1.25rem}.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:140px 0 80px;text-align:center}.selo{width:64px;height:64px;border-radius:50%;background:var(--verde);color:var(--branco);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 28px}.hero h1{font-family:Fraunces,serif;font-size:clamp(2rem,5vw,2.8rem);font-weight:500;line-height:1.12}.hero h1 em{font-style:italic;color:var(--acento)}.hero p{margin-top:16px;color:var(--tinta-suave);font-size:1rem;max-width:480px;margin-left:auto;margin-right:auto}.link-box{margin-top:44px;background:var(--branco);border-radius:14px;padding:28px;box-shadow:var(--sombra);border-top:4px solid var(--verde);text-align:left}.link-box label{font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta-suave);display:block;margin-bottom:10px}.link-row{display:flex;gap:10px}.link-row input{flex:1;border:1px solid var(--linha);background:var(--fundo);border-radius:8px;padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--tinta)}.btn-copy{background:var(--tinta);color:var(--fundo);border:none;border-radius:8px;padding:0 20px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}.btn-copy.copiado{background:var(--verde)}.share-row{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}.btn-share{flex:1;padding:14px 20px;border-radius:100px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--verde);color:var(--branco);border:none;cursor:pointer;min-width:200px}.sim-note{margin-top:24px;font-size:.84rem;color:var(--tinta-suave);background:rgba(185,138,46,.1);border:1px solid rgba(185,138,46,.3);border-radius:8px;padding:12px 16px;text-align:left}.voltar{display:inline-block;margin-top:36px;font-size:.9rem;font-weight:500;color:var(--tinta-suave);text-decoration:underline}@media(max-width:560px){.link-row{flex-direction:column}.btn-copy{padding:12px}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a href="index.html" class="logo">Gabriela &amp; Dani</a></div></nav>
<section class="hero"><div class="container"><div class="selo" aria-hidden="true">✓</div><h1>Cadastro <em>concluído</em>.</h1><p>Obrigado por participar voluntariamente da rede. Você pode compartilhar seu link pessoal, mas isso não é obrigatório.</p><div class="link-box" id="linkBox"><label for="linkIndicacao">Seu link pessoal</label><div class="link-row"><input type="text" id="linkIndicacao" readonly value="" aria-describedby="shareStatus"><button type="button" class="btn-copy" id="btnCopiar">Copiar link</button></div><div class="share-row"><button type="button" class="btn-share" id="btnWhatsapp">Compartilhar voluntariamente no WhatsApp</button></div><p class="sim-note" id="shareStatus" role="status" aria-live="polite">Você decide se quer enviar o link. Não inclua dados pessoais de outras pessoas na mensagem.</p></div><p class="sim-note" id="simNote" style="display:none;" role="alert"></p><a href="index.html" class="voltar">← Voltar para o site</a></div></section>
<script>
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get('codigo') || '';
  const link = params.get('link') || (codigo ? `${window.location.origin}/?ref=${encodeURIComponent(codigo)}` : '');
  const linkBox = document.getElementById('linkBox');
  const note = document.getElementById('simNote');
  const status = document.getElementById('shareStatus');
  document.getElementById('linkIndicacao').value = link;
  if (!codigo || !link) {
    linkBox.style.display = 'none';
    note.textContent = 'Não encontramos um link pessoal nesta confirmação. Volte ao site ou fale com a equipe pelo canal oficial.';
    note.style.display = 'block';
  }
  document.getElementById('btnCopiar').addEventListener('click', async () => {
    if (!link) return;
    const button = document.getElementById('btnCopiar');
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(link);
      else { const input = document.getElementById('linkIndicacao'); input.focus(); input.select(); document.execCommand('copy'); }
      const original = button.textContent; button.textContent = 'Link copiado ✓'; button.classList.add('copiado'); status.textContent = 'Link copiado. Compartilhe apenas se quiser.';
      setTimeout(() => { button.textContent = original; button.classList.remove('copiado'); }, 2200);
    } catch { status.textContent = 'Não foi possível copiar automaticamente. Selecione o link e copie manualmente.'; }
  });
  document.getElementById('btnWhatsapp').addEventListener('click', () => {
    if (!link) return;
    const texto = encodeURIComponent(`Eu me cadastrei para receber informações da Rede de Apoio de Dra. Gabriela e Dani Cunha. Se quiser conhecer, acesse: ${link}`);
    window.open(`https://wa.me/?text=${texto}`, '_blank', 'noopener,noreferrer');
  });
</script>
</body>
</html>
